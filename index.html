    <script>
      /* AI Studio environment constraint: HMR is disabled, ignore WebSocket errors */
      (function() {
        function isWsError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || err.reason || '')) + '';
          return msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]') || msg.includes('vite-hmr');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
